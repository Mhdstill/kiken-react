<body class="g-sidenav-show">
  <div id="root"></div>
  <noscript>Vous devez activer JavaScript pour exécuter cette application.</noscript>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Utiliser un chemin relatif au lieu d'un chemin absolu
        const swPath = new URL('./service-worker.js', window.location.href).href;
        console.log('Tentative d\'enregistrement du SW à:', swPath);
        
        navigator.serviceWorker.register(swPath, { scope: './' })
          .then(registration => {
            console.log('SW enregistré avec succès:', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
            
            // Tentative de secours avec un chemin absolu si le chemin relatif échoue
            console.log('Tentative de secours avec chemin absolu');
            navigator.serviceWorker.register('/service-worker.js')
              .then(registration => {
                console.log('SW enregistré avec succès (secours):', registration);
              })
              .catch(secondError => {
                console.error('Échec de l\'enregistrement du SW même avec secours:', secondError);
              });
          });
      });
    }
    
    // Détection du mode PWA
    window.addEventListener('load', () => {
      if (window.matchMedia('(display-mode: standalone)').matches || 
          window.navigator.standalone === true) {
        document.body.classList.add('pwa-mode');
      }
    });
  </script>
</body>

</html>
